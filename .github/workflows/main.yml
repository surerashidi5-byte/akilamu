name: Build Android APK Automatically

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK for Android Compilation
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython setuptools

      - name: Fix SDCard Path for Linux Runner
        run: |
          sudo mkdir -p /sdcard
          sudo chmod -R 777 /sdcard

      - name: Execute T-Max Autonomous Builder Engine
        run: |
          python auto_fix_all.py || true
          python autonomous_builder.py || true

      - name: Find and Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AKILAMU-Android-App
          path: |
            **/*.apk
            *.apk
          if-no-files-found: warn
